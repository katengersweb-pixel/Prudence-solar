<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGradCR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="auraCR" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="circleGradCR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradCR)" />
  <circle cx="200" cy="120" r="130" fill="url(#auraCR)" />
  <circle cx="200" cy="115" r="58" fill="url(#circleGradCR)" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="4 4" />
  <!-- Stylized Initials -->
  <text x="200" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CR</text>
  <!-- Text Label -->
  <rect x="110" y="200" width="180" height="28" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#93C5FD" stroke-width="1" />
  <text x="200" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E0E7FF" text-anchor="middle" letter-spacing="0.5">MANAGING PARTNER</text>
  <text x="200" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#93C5FD" text-anchor="middle">Photo update coming soon</text>
</svg>